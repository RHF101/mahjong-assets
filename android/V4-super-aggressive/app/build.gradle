plugins { id 'com.android.application' }
android {
    namespace 'com.rhf.snatcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.rhf.snatcher.v4"
        minSdk 21
        targetSdk 34
        versionCode 41
        versionName "4.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
